name: CI

on:
  push:
    branches: [main, feat/capstone]
  pull_request:
    branches: [main, feat/capstone]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build-storybook
